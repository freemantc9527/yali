[package]
name = "yali-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "鸭梨 GUI 壳（Tauri 2）"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
yali-core = { path = "../crates/yali-core" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
notify = "8"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# 剪贴板（T-016）：NSPasteboard 直接给编码后的 PNG；objc2 系列本就是 Tauri 的传递依赖
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

[lib]
name = "yali_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
