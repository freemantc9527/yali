[workspace]
resolver = "2"
members = ["crates/yali-core", "crates/yali-cli", "src-tauri"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/freemantc9527/yali"
authors = ["freemantc9527"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "process", "macros", "sync"] }
clap = { version = "4", features = ["derive"] }
