[workspace]
resolver = "2"
members = ["crates/yali-core", "crates/yali-cli", "src-tauri"]

[workspace.package]
version = "0.3.0-alpha"
edition = "2021"
license = "Apache-2.0"
authors = ["Yali contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# tokio T-003 引回（引擎子进程池 + 并发批处理），features 见 yali-core
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "process", "macros", "sync", "fs", "io-util", "time"] }
