name: macOS release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.candidate.outputs.version }}
      commit: ${{ steps.candidate.outputs.commit }}
      prerelease: ${{ steps.candidate.outputs.prerelease }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Test release validation
        run: python3 -m unittest discover -s scripts -p 'test_release.py' -v
      - name: Validate candidate and version tag
        id: candidate
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: python3 scripts/release.py check --tag "$RELEASE_TAG" --output "$GITHUB_OUTPUT"

  build:
    needs: prepare
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            arch: x86_64
            target: x86_64-apple-darwin
    env:
      RUSTUP_TOOLCHAIN: '1.100.0'
      CARGO_BUILD_JOBS: '3'
      CARGO_TERM_COLOR: always
      HOMEBREW_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '12.21.0'
          run_install: false
      - name: Install native toolchain and engines
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          brew bundle --file "Brewfile"
          cargo install tauri-cli --version '=2.12.5' --locked
          pnpm --dir ui install --frozen-lockfile
      - name: Verify runner and Rust architectures
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          rustc -vV
          test "$(rustc -vV | awk '/^host:/ {print $2}')" = "$EXPECTED_TARGET"
      - name: Test Rust and UI
        env:
          YALI_HOME: ${{ runner.temp }}/yali-release-tests
        run: |
          cargo test --locked -p yali-core -p yali-cli -p yali-app -- --test-threads=1
          pnpm --dir ui test
      - name: Build final self-contained App
        run: bash scripts/build.sh
      - name: Exercise final App without development dependencies
        run: python3 scripts/smoke-bundle.py
      - name: Check compression quality using bundled CLI
        env:
          YALI_BIN: ${{ github.workspace }}/target/release/bundle/macos/Yali.app/Contents/MacOS/yali
        run: |
          bash benchkit/bench.sh --profile default
          bash benchkit/bench.sh --profile jpg
      - name: Archive final App and record provenance
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          git diff --exit-code
          python3 scripts/release.py package --arch "$RELEASE_ARCH" --output "target/release-assets"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-${{ matrix.arch }}
          path: target/release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [prepare, build]
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: macos-*
          path: release-assets
          merge-multiple: true
      - name: Require both architectures from the same candidate
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: python3 scripts/release.py assemble --directory "release-assets" --version "$VERSION" --commit "$COMMIT"
      - name: Create draft, verify uploaded assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" = "$COMMIT"
          gh api --paginate --slurp "repos/$GH_REPO/releases" > "$RUNNER_TEMP/existing-releases.json"
          jq -e --arg tag "$RELEASE_TAG" 'all(.[][]; .tag_name != $tag)' "$RUNNER_TEMP/existing-releases.json"
          args=(--verify-tag --draft --target "$COMMIT" --title "Yali $RELEASE_TAG" --notes-file "release-assets/RELEASE_NOTES.md")
          if [[ "$PRERELEASE" == true ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${args[@]}" release-assets/Yali_*.dmg release-assets/Yali_*.json release-assets/SHA256SUMS
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,targetCommitish,assets > "$RUNNER_TEMP/release-state.json"
          jq -e --arg sha "$COMMIT" --argjson pre "$PRERELEASE" '.isDraft and .isPrerelease == $pre and .targetCommitish == $sha and (.assets | length) == 5' "$RUNNER_TEMP/release-state.json"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/release-readback"
          cd "$RUNNER_TEMP/release-readback"
          shasum -a 256 --check SHA256SUMS
          cmp SHA256SUMS "$GITHUB_WORKSPACE/release-assets/SHA256SUMS"
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" = "$COMMIT"
          gh release edit "$RELEASE_TAG" --verify-tag --draft=false
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,assets | jq -e --argjson pre "$PRERELEASE" '(.isDraft | not) and .isPrerelease == $pre and (.assets | length) == 5'
