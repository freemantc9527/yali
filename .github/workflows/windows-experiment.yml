name: Windows release build

on: {"workflow_call": {"inputs": {"ref": {"type": "string", "required": true}}}}

permissions:
  contents: read

concurrency:
  group: windows-experiment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    name: Build and exercise Windows portable ZIP
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      PYTHONUTF8: '1'
      RUSTUP_TOOLCHAIN: '1.100.0'
      RUSTFLAGS: '-C target-feature=+crt-static'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Require the tagged candidate commit
        env:
          CANDIDATE: ${{ inputs.ref }}
        run: |
          if ($env:CANDIDATE -notmatch '^[0-9a-f]{40}$') { throw 'Expected a full candidate SHA' }
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:GITHUB_SHA -or $actual -ne $env:CANDIDATE) {
            throw 'Windows candidate differs from the release tag'
          }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '12.21.0'
          run_install: false
      - name: Restore pinned Tauri build CLI
        id: tauri-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: windows-tauri-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-2.12.5-static-v1
      - name: Install build tools
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ('${{ steps.tauri-cache.outputs.cache-hit }}' -ne 'true') {
            cargo install tauri-cli --version '=2.12.5' --locked
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $tauriVersion = cargo tauri --version
          if ($LASTEXITCODE -ne 0 -or $tauriVersion -ne 'tauri-cli 2.12.5') { throw "Unexpected Tauri CLI: $tauriVersion" }
          foreach ($tool in @('cmake', 'ninja')) {
            if (!(Get-Command $tool -ErrorAction SilentlyContinue)) { throw "Required runner build tool missing: $tool" }
          }
          New-Item -ItemType Directory -Force target | Out-Null
      - name: Save pinned Tauri build CLI
        if: steps.tauri-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: windows-tauri-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-2.12.5-static-v1
      - name: Install frontend dependencies
        run: pnpm --dir ui install --frozen-lockfile
      - name: Validate packaging scripts
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Prepare pinned image engines and corresponding sources
        run: python scripts/windows-runtime.py prepare --build-dir target
      - name: Configure isolated test engine environment
        run: |
          "YALI_HOME=$(Join-Path $env:RUNNER_TEMP 'yali-windows-tests')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $prepared = Get-Content target/windows-prepared.json -Raw | ConvertFrom-Json
          $engineDirs = @((Join-Path $prepared.work 'bin'), (Join-Path $prepared.sources.vips 'bin'), $prepared.sources.oxipng)
          "YALI_ENGINES_PATH=$($engineDirs -join ';')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          foreach ($directory in $engineDirs) {
            $directory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Execute Rust tests
        id: rust-tests
        run: cargo test --locked -p yali-core -p yali-cli -p yali-app -- --test-threads=1
      - name: Diagnose failed Windows test loader
        if: failure() && steps.rust-tests.outcome == 'failure'
        run: python scripts/diagnose-windows-loader.py --build-dir target
      - name: Test UI
        run: pnpm --dir ui test
      - name: Build release CLI
        run: cargo build --locked --release -p yali-cli
      - name: Build real frontend and desktop workbench
        run: cargo tauri build --no-bundle
      - name: Assemble ZIP and verify all PE dependencies
        run: python scripts/windows-runtime.py package --build-dir target --output target/windows-assets
      - name: Exercise final extracted ZIP offline without FFmpeg
        run: |
          python scripts/smoke-windows.py --directory 'target/windows-assets/解压 验证 [Yali]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target/windows-assets/smoke-report.json target/windows-assets/smoke-without-ffmpeg.json
      - name: Compare final ZIP with same-version encoding references
        run: |
          $ffmpeg = (Get-Content target/windows-ffmpeg-path.txt -Raw).Trim()
          python scripts/smoke-windows.py --directory 'target/windows-assets/解压 验证 [Yali]' --ffmpeg $ffmpeg
      - name: Attest verified Windows release assets
        run: python scripts/release.py attest-windows --directory target/windows-assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-windows-x86_64
          path: |
            target/windows-assets/Yali_*-experiment.zip
            target/windows-assets/Yali_*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-windows-corresponding-sources
          path: target/windows-assets/Yali_windows_corresponding-sources.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
